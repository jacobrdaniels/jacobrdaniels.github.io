<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex"><title>Background options — Jacob Daniels</title>
<style>
@font-face{font-family:Chicago;src:url(assets/fonts/sysfont.woff2)}
*{box-sizing:border-box}body{margin:0;background:#d0d0d0;color:#171717;font:15px/1.4 system-ui,sans-serif}.controls{padding:12px 20px;background:#fff;border-bottom:2px solid #111}h1{font:24px Chicago,monospace;margin:0 0 8px}.options{display:flex;flex-wrap:wrap;gap:8px}button{font:inherit;background:#fff;border:1px solid #111;padding:5px 12px;cursor:pointer;box-shadow:2px 2px #111}button[aria-pressed=true]{background:#111;color:white}button:focus-visible{outline:2px dotted #111;outline-offset:4px}p{margin:8px 0 0;font-size:13px}iframe{width:100%;height:calc(100vh - 132px);min-height:600px;display:block;border:0}@media(max-width:600px){.controls{padding:10px 12px}iframe{height:calc(100vh - 182px)}}
</style></head><body><header class="controls"><h1>Pick a desktop</h1><div class="options" role="group" aria-label="Background options"><button data-theme="landscape" aria-pressed="true">1. Pixel landscape</button><button data-theme="geometric" aria-pressed="false">2. Geometric tiles</button><button data-theme="dusk" aria-pressed="false">3. Dithered dusk</button></div><p id="description" aria-live="polite">Muted hills, a small sun, and a five-color palette. Preview only; your main site is unchanged.</p></header><iframe title="Home page with selected background" src="index.html"></iframe>
<script>
const frame=document.querySelector('iframe');let theme='landscape';
const descriptions={landscape:'Muted hills, a small sun, and a five-color palette.',geometric:'Small repeating shapes in dusty blue, sage, and warm cream.',dusk:'A blue-to-peach sky made from crisp patterned pixels.'};
function apply(){const root=frame.contentDocument.documentElement;root.style.backgroundImage=`url("assets/background-prototypes/${theme}.svg")`;root.style.backgroundSize=theme==='geometric'?'96px 96px':'cover';root.style.backgroundPosition='center bottom';root.style.backgroundAttachment='fixed';root.style.imageRendering='pixelated';const image=frame.contentDocument.querySelector('.portrait-window img');if(image)image.style.imageRendering='auto';}
frame.addEventListener('load',apply);document.querySelectorAll('button').forEach(button=>button.addEventListener('click',()=>{theme=button.dataset.theme;document.querySelectorAll('button').forEach(b=>b.setAttribute('aria-pressed',String(b===button)));document.getElementById('description').textContent=descriptions[theme]+' Preview only; your main site is unchanged.';apply()}));
</script></body></html>
