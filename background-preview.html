<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex"><title>Background options — Jacob Daniels</title>
<style>
@font-face{font-family:Chicago;src:url(assets/fonts/sysfont.woff2)}
*{box-sizing:border-box}body{min-height:100vh;display:flex;flex-direction:column;margin:0;background:#d0d0d0;color:#171717;font:15px/1.4 system-ui,sans-serif}.controls{padding:12px 20px;background:#fff;border-bottom:2px solid #111}h1{font:24px Chicago,monospace;margin:0 0 8px}.options{display:flex;flex-wrap:wrap;gap:8px}button{display:inline-flex;align-items:center;gap:8px;font:inherit;background:#fff;border:1px solid #111;padding:5px 12px;cursor:pointer;box-shadow:2px 2px #111}button[aria-pressed=true]{background:#111;color:white}button:focus-visible{outline:2px dotted #111;outline-offset:4px}p{margin:8px 0 0;font-size:13px}button img{width:32px;height:32px;image-rendering:pixelated}iframe{width:100%;flex:1;min-height:75vh;display:block;border:0}@media(max-width:600px){.controls{padding:10px 12px}}
</style></head><body><header class="controls"><h1>Pick a desktop</h1><div class="options" role="group" aria-label="Background options"><button data-theme="landscape" aria-pressed="true">1. Pixel landscape</button><button data-theme="geometric" aria-pressed="false">2. Geometric tiles</button><button data-theme="dusk" aria-pressed="false">3. Dithered dusk</button><button data-theme="blue-weave" aria-pressed="false"><img src="assets/background-prototypes/blue-weave.png" alt="">4. Blue weave</button><button data-theme="blue-speckle" aria-pressed="false"><img src="assets/background-prototypes/blue-speckle.png" alt="">5. Blue speckle</button><button data-theme="circuit-board" aria-pressed="false"><img src="assets/background-prototypes/circuit-board.png" alt="">6. Circuit board</button><button data-theme="dark-stone" aria-pressed="false"><img src="assets/background-prototypes/dark-stone.png" alt="">7. Dark stone</button><button data-theme="purple-ripples" aria-pressed="false"><img src="assets/background-prototypes/purple-ripples.png" alt="">8. Purple ripples</button><button data-theme="blue-shapes" aria-pressed="false"><img src="assets/background-prototypes/blue-shapes.png" alt="">9. Blue shapes</button><button data-theme="lavender-mosaic" aria-pressed="false"><img src="assets/background-prototypes/lavender-mosaic.png" alt="">10. Lavender mosaic</button><button data-theme="stars" aria-pressed="false"><img src="assets/background-prototypes/stars.png" alt="">11. Stars</button><button data-theme="purple-swirl" aria-pressed="false"><img src="assets/background-prototypes/purple-swirl.png" alt="">12. Purple swirl</button></div><p id="description" aria-live="polite">Muted hills, a small sun, and a five-color palette. Preview only; the main site uses Pixel landscape.</p></header><iframe title="Home page with selected background" src="index.html"></iframe>
<script>
const frame=document.querySelector('iframe');let theme='landscape';
const descriptions={landscape:'Muted hills, a small sun, and a five-color palette.',geometric:'Small repeating shapes in dusty blue, sage, and warm cream.',dusk:'A blue-to-peach sky made from crisp patterned pixels.'};
const tiles=new Set(["blue-weave", "blue-speckle", "circuit-board", "dark-stone", "purple-ripples", "blue-shapes", "lavender-mosaic", "stars", "purple-swirl"]);
descriptions['blue-weave']='Blue weave, tiled at its original 128 × 128 size.';
descriptions['blue-speckle']='Blue speckle, tiled at its original 128 × 128 size.';
descriptions['circuit-board']='Circuit board, tiled at its original 128 × 128 size.';
descriptions['dark-stone']='Dark stone, tiled at its original 128 × 128 size.';
descriptions['purple-ripples']='Purple ripples, tiled at its original 128 × 128 size.';
descriptions['blue-shapes']='Blue shapes, tiled at its original 128 × 128 size.';
descriptions['lavender-mosaic']='Lavender mosaic, tiled at its original 128 × 128 size.';
descriptions['stars']='Stars, tiled at its original 128 × 128 size.';
descriptions['purple-swirl']='Purple swirl, tiled at its original 128 × 128 size.';
function apply(){const root=frame.contentDocument.documentElement;root.style.backgroundImage=`url("assets/background-prototypes/${theme}.${tiles.has(theme)?'png':'svg'}")`;root.style.backgroundSize=tiles.has(theme)?'128px 128px':theme==='geometric'?'96px 96px':'cover';root.style.backgroundRepeat=tiles.has(theme)||theme==='geometric'?'repeat':'no-repeat';root.style.backgroundPosition=tiles.has(theme)?'left top':'center bottom';root.style.backgroundAttachment='fixed';root.style.imageRendering='pixelated';const image=frame.contentDocument.querySelector('.portrait-window img');if(image)image.style.imageRendering='auto';}
frame.addEventListener('load',apply);document.querySelectorAll('button').forEach(button=>button.addEventListener('click',()=>{theme=button.dataset.theme;document.querySelectorAll('button').forEach(b=>b.setAttribute('aria-pressed',String(b===button)));document.getElementById('description').textContent=descriptions[theme]+' Preview only; the main site uses Pixel landscape.';apply()}));
</script></body></html>
